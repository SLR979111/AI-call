<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LiveKit 媒体接入测试</title>
<style>
body{font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:#0f1216;color:#e6edf3;margin:24px}
main{max-width:920px;margin:auto}
h1{font-size:20px}
.card{background:#171c22;border:1px solid #2a3440;border-radius:10px;padding:16px;margin:12px 0}
button{background:#1f6feb;color:#fff;border:0;border-radius:7px;padding:9px 14px;margin-right:8px;cursor:pointer}
button.secondary{background:#30363d}button:disabled{opacity:.45;cursor:not-allowed}
pre{background:#0b0e12;border:1px solid #2a3440;border-radius:8px;padding:12px;min-height:110px;white-space:pre-wrap}
.good{color:#3fb950}.bad{color:#f85149}.dim{color:#8b98a5}
</style>
<main>
<h1>LiveKit 媒体接入测试</h1>
<p class="dim">只验证浏览器 ↔ LiveKit Server：创建会话、取 LiveKit Token、入房、发布麦克风。服务端 ASR/Agent/TTS 音频桥尚未接入。</p>
<div class="card">
  <button id="start">创建会话并入房</button>
  <button id="mic" class="secondary" disabled>开/关麦克风</button>
  <button id="leave" class="secondary" disabled>离开</button>
  <div id="state" style="margin-top:12px">状态：未开始</div>
</div>
<div class="card">
  <div>Room: <b id="room">—</b></div>
  <div>Local: <b id="local">—</b></div>
  <div>Participants: <b id="parts">—</b></div>
  <div>Remote audio: <b id="remote">—</b></div>
  <div id="audio"></div>
</div>
<pre id="log"></pre>
<script type="module">
import { Room, RoomEvent, Track } from './vendor/livekit-client.esm.mjs';

const $ = (id) => document.getElementById(id);
const log = (s) => { $('log').textContent += s + '\n'; };
let room = null;
let micOn = false;

$('start').onclick = async () => {
  $('start').disabled = true;
  try {
    const sr = await fetch('/sessions', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({mode: 'voice', scenario_id: 'pop_qualification_audit'})
    });
    if (!sr.ok) throw new Error('POST /sessions ' + sr.status + ' ' + await sr.text());
    const session = await sr.json();
    log('session=' + session.session_id);

    const tr = await fetch('/sessions/' + session.session_id + '/rtc', {method: 'POST'});
    if (!tr.ok) throw new Error('POST /rtc ' + tr.status + ' ' + await tr.text());
    const media = await tr.json();
    log('livekit url=' + media.url + ' room=' + media.room);
    $('room').textContent = media.room;

    room = new Room({adaptiveStream: false, dynacast: false});
    room.on(RoomEvent.Connected, () => {
      $('state').textContent = '状态：已连接';
      $('state').className = 'good';
      $('local').textContent = room.localParticipant.identity;
      $('mic').disabled = false;
      $('leave').disabled = false;
    });
    room.on(RoomEvent.ParticipantConnected, (p) => {
      log('participant joined: ' + p.identity);
      $('parts').textContent = String(room.remoteParticipants.size + 1);
    });
    room.on(RoomEvent.ParticipantDisconnected, (p) => {
      log('participant left: ' + p.identity);
      $('parts').textContent = String(room.remoteParticipants.size + 1);
    });
    room.on(RoomEvent.TrackSubscribed, (track, pub, participant) => {
      log('track subscribed: ' + participant.identity + ' ' + track.kind);
      if (track.kind === Track.Kind.Audio) {
        const el = track.attach();
        el.autoplay = true;
        $('audio').appendChild(el);
        $('remote').textContent = participant.identity;
      }
    });
    room.on(RoomEvent.Disconnected, () => {
      $('state').textContent = '状态：已断开';
      $('state').className = 'bad';
    });
    room.on(RoomEvent.MediaDevicesError, (e) => log('media error: ' + e.message));

    await room.connect(media.url, media.token);
    $('parts').textContent = String(room.remoteParticipants.size + 1);
    log('connected');
  } catch (e) {
    $('state').textContent = '失败：' + e.message;
    $('state').className = 'bad';
    log('ERROR ' + (e.stack || e));
    $('start').disabled = false;
  }
};

$('mic').onclick = async () => {
  if (!room) return;
  micOn = !micOn;
  await room.localParticipant.setMicrophoneEnabled(micOn);
  log('microphone=' + micOn);
  $('mic').textContent = micOn ? '关闭麦克风' : '打开麦克风';
};

$('leave').onclick = async () => {
  if (room) await room.disconnect();
  room = null; micOn = false;
  $('start').disabled = false; $('mic').disabled = true; $('leave').disabled = true;
  $('state').textContent = '状态：已离开'; $('state').className = 'dim';
};
</script>
</main>
</html>
