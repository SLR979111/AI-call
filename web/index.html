<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>AI Call</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/call.css">
  <link rel="stylesheet" href="/static/text-engine.css">
</head>
<body>
  <main id="viewport" aria-label="对话区域" tabindex="0">
    <div id="transcript" role="log" aria-label="对话记录" aria-live="polite" aria-relevant="additions text"></div>
  </main>
  <div class="sr-only" role="status"><span id="connection">准备连接</span><span id="phase">准备好了，开始聊吧</span></div>
  <div id="error" class="error" role="alert" hidden></div>
  <footer class="controls" aria-label="通话控制">
    <p id="callNotice" class="call-notice" role="status" hidden></p>
    <details id="timingPanel" class="timing-panel" hidden>
      <summary id="timingSummary">本通话时延 · 等待麦克风输入</summary>
      <p>从你说完开始计时。首声包含可能播放的过渡音，正文是开始回答问题的声音。</p>
      <table><thead><tr><th>语音轮</th><th>首声</th><th>正文首播</th><th>答复来源</th></tr></thead><tbody id="timingRows"></tbody></table>
    </details>
    <form id="textForm" class="text-form" hidden>
      <label class="sr-only" for="textInput">输入一句话</label>
      <input id="textInput" maxlength="2000" autocomplete="off" placeholder="输入…">
      <button id="sendText" aria-label="发送消息" title="发送消息" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 6-6 6 6M12 6v13"/></svg></button>
    </form>
    <div class="toolbar">
      <button id="editTask" class="order-picker" aria-label="选择工单" aria-haspopup="dialog" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l3 3v15H6zM9 10h6m-6 4h6"/></svg>
        <span id="selectedTitle">选择工单</span><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/icons.svg#chevron"/></svg>
      </button>
      <div id="startControls" class="button-group">
        <button id="startVoice" class="primary" aria-label="开始通话" title="开始通话" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H4a1 1 0 0 0-1 1c0 9.4 7.6 17 17 17a1 1 0 0 0 1-1v-3l-5-2-2 2a14 14 0 0 1-7-7l2-2-2-5Z"/></svg></button>
        <button id="startText" aria-label="文字试聊" title="文字试聊" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 9h1m3 0h1m3 0h1m3 0h0M6 12h1m3 0h1m3 0h1m3 0h0M7 16h10"/></svg></button>
        <button id="cancelDial" type="button" aria-label="取消等待接通" title="取消等待接通" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <div id="callControls" class="button-group" hidden>
        <button id="mute" aria-label="暂停麦克风" title="暂停麦克风" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-3 0h6"/><path class="mute-slash" d="m3 3 18 18"/></svg></button>
        <button id="toggleText" aria-label="打开文字输入" title="打开文字输入" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 9h1m3 0h1m3 0h1m3 0h1M7 15h10"/></svg></button>
        <button id="interrupt" aria-label="打断" title="打断"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M12 7l7 5-7 5Z"/></svg></button>
        <button id="stop" aria-label="结束对话" title="结束对话"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13c4-5 14-5 18 0v5h-5v-4a13 13 0 0 0-8 0v4H3v-5Z"/></svg></button>
      </div>
      <div class="toolbar-end"><button id="latest" aria-label="回到最新" title="回到最新" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14m-6-6 6 6 6-6M5 21h14"/></svg></button></div>
    </div>
  </footer>
  <dialog id="taskDialog" aria-labelledby="orderHeading">
    <div class="order-heading"><h1 id="orderHeading">工单流程</h1><button id="closeDialog" type="button" aria-label="关闭"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/icons.svg#close"/></svg></button></div>
    <div class="order-toolbar">
      <select id="taskPack" aria-label="选择工单"></select>
      <button id="addOrder" class="action" type="button"><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/icons.svg#plus"/></svg> 添加工单</button>
    </div>
    <p id="orderMessage" role="status" hidden></p>
    <section id="graphView">
      <nav class="order-tabs" aria-label="电话文件">
        <button type="button" id="graphTab" aria-pressed="true">流程图</button>
        <button type="button" id="materialsTab" aria-pressed="false">应答与背景</button>
      </nav>
      <div id="phoneGraph"></div>
      <div id="materialsView" hidden>
        <label>开场白<textarea id="basicOpening" maxlength="180"></textarea></label>
        <label>基础应答<textarea id="basicGuide" maxlength="800" rows="3"></textarea></label>
        <label>背景资料<textarea id="backgroundText" maxlength="2400" rows="6"></textarea></label>
      </div>
      <form id="nodeForm" class="node-form" hidden>
        <h2>编辑节点</h2>
        <label>小目标<input id="nodeGoal" required maxlength="320"></label>
        <label>应答动作<textarea id="nodeAction" maxlength="320" rows="2"></textarea></label>
        <label>完成依据<textarea id="nodeDone" required maxlength="320" rows="2"></textarea></label>
        <fieldset><legend>前置节点</legend><div id="nodeDeps"></div></fieldset>
        <fieldset><legend>涉及的工单要点</legend><div id="nodePoints"></div></fieldset>
        <div class="action-row"><button class="action" type="submit">应用到草稿</button><button class="action" type="button" id="cancelNode">返回流程图</button><button class="action" type="button" id="removeNode">删除节点</button></div>
      </form>
      <div class="action-row" id="graphActions"><button type="button" class="action" id="editGraph">编辑电话文件</button><button type="button" class="action" id="addNode" hidden><svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/icons.svg#plus"/></svg> 添加节点</button>
        <button type="button" class="action" id="editSource">编辑工单</button><button type="button" class="action" id="downloadPhone">下载电话文件</button></div>
      <label id="defaultGoalField" hidden>默认通话目标<select id="defaultGoal"></select></label>
    </section>
    <form id="taskForm" hidden>
      <label>工单名称<input id="editTitle" required maxlength="80"></label>
      <label>对话目标<textarea id="editGoal" required maxlength="1000" rows="2"></textarea></label>
      <label>已知信息<textarea id="editFacts" maxlength="5000" rows="4"></textarea></label>
      <label>需要说清的要点 <small>每行一项，最多 8 项</small><textarea id="editPoints" required rows="3"></textarea></label>
      <label>开场白<textarea id="editOpening" required maxlength="180" rows="2"></textarea></label>
      <button id="generateOrder" type="submit" class="action primary-action">生成流程图</button>
    </form>
    <div class="review-actions" id="reviewActions" hidden><button class="action" id="discardDraft" type="button">放弃草稿</button><button class="action primary-action" id="saveTask" type="button">确认并使用</button></div>
    <details class="call-options" id="callOptions"><summary>通话选项</summary>
      <label>通话模式<select id="callMode"><option value="cloud">云端语音 · 当前音色</option><option value="local">纯本地 · MeloTTS 普通话女声</option></select></label>
      <label class="prediction-option"><input id="prediction" type="checkbox" checked>提前准备可能的回复</label>
      <div class="session-details"><span id="outcomeText">等待开始</span><span id="latency"></span><span id="duration"></span><span id="cacheStat"></span><ul id="checkpoints"></ul></div>
      <div class="action-row"><a href="/demo/?library=1" target="_blank" rel="noopener">观看对话回放 <svg class="ui-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="/static/icons.svg#external"/></svg></a><button class="action" id="export" type="button">导出对话</button><button class="action" id="restoreTask" type="button">使用默认工单</button></div>
    </details>
    <div class="import-row"><button type="button" class="action" id="importPhone">载入电话文件</button><input id="phoneInput" type="file" accept=".json" hidden></div>
  </dialog>
  <script src="/static/text-motion.js"></script>
  <script src="/static/text-engine.js"></script>
  <script type="module" src="/static/call.js"></script>
</body>
</html>
