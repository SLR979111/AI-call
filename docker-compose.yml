# Fake-skeleton stack for the competition runtime: CPU-only x86_64, 8C/16GB,
# Docker Compose, no GPU and no external tunnel.
#
# Requires Docker Compose v2.24+ for the optional env_file entry. On an older
# Compose, copy .env.example to .env first and drop `required: false`.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aicall-app:local
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # The bind mount lives at /app/data regardless of DATA_DIR in .env.
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 10s

