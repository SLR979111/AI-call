# CPU app plus an explicitly enabled GPU sidecar. Models are never downloaded at runtime.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aicall-app:local
    ports:
      - "8081:8080"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /app/data
      ASR_PROVIDER: ${ASR_PROVIDER:-sherpa}
      TTS_PROVIDER: ${TTS_PROVIDER:-qwen3}
      TTS_FALLBACK_PROVIDER: ${TTS_FALLBACK_PROVIDER:-}
      QWEN_TTS_URL: ${QWEN_TTS_URL:-http://qwen-tts:8090}
      QWEN_GROUP_SENTENCES: ${QWEN_GROUP_SENTENCES:-3}
      QWEN_TTS_TIMEOUT_S: ${QWEN_TTS_TIMEOUT_S:-30}
      ASR_MODEL_DIR: /models/asr
      MELO_MODEL_DIR: /models/melo
    volumes:
      - ./data:/app/data
      - type: bind
        source: ${ASR_MODEL_HOST_DIR:-./models/asr}
        target: /models/asr
        read_only: true
      - type: bind
        source: ${MELO_MODEL_HOST_DIR:-./models/melo}
        target: /models/melo
        read_only: true
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 15s

  qwen-tts:
    profiles: [gpu]
    build:
      context: .
      dockerfile: services/qwen_tts/Dockerfile
    image: aicall-qwen-tts:local
    environment:
      APP_ENV: prod
      QWEN_MODEL_DIR: /models/qwen
      QWEN_REF_AUDIO: /voice/reference.wav
      QWEN_REF_TEXT: ${QWEN_REF_TEXT:-}
      QWEN_REFERENCE_CONSENT: ${QWEN_REFERENCE_CONSENT:-0}
      QWEN_INSTRUCT: ${QWEN_INSTRUCT:-用自然、平稳、亲切的客服语气，语速适中，句间停顿自然，不要夸张。}
      QWEN_CHUNK_SIZE: ${QWEN_CHUNK_SIZE:-4}
      QWEN_NON_STREAMING_MODE: ${QWEN_NON_STREAMING_MODE:-false}
      QWEN_TEMPERATURE: ${QWEN_TEMPERATURE:-0.9}
      QWEN_TOP_K: ${QWEN_TOP_K:-50}
      QWEN_TOP_P: ${QWEN_TOP_P:-1.0}
      QWEN_MAX_NEW_TOKENS: ${QWEN_MAX_NEW_TOKENS:-2048}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - type: bind
        source: ${QWEN_MODEL_HOST_DIR:-./models/qwen}
        target: /models/qwen
        read_only: true
      - type: bind
        source: ${QWEN_VOICE_HOST_DIR:-./data/voice}
        target: /voice
        read_only: true
    expose: ["8090"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
