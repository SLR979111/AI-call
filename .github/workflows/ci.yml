name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest + contract validation + WS E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      DEV_NO_AUTH: "1"
      DATA_DIR: ./data
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare runtime directories
        run: mkdir -p data

      - name: Run tests
        run: pytest -q

      - name: Validate contracts
        run: python contracts/validate.py contracts/fixtures

      - name: Frontend protocol tests
        working-directory: web/rtc
        run: |
          node test/golden-replay.mjs
          node test/pcm-path.mjs
          node test/uplink-file.mjs
          node test/barge.mjs

      - name: Headless WebSocket E2E
        env:
          PORT: "8081"
        run: sh scripts/ci_e2e.sh
